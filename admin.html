<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - SK PLUS</title>
    <style>
        body { background-color: #050B14; color: white; font-family: Arial, sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .admin-container { background-color: #0A2540; padding: 30px; border-radius: 10px; width: 100%; max-width: 600px; border: 1px solid #1E3A5F; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #F5B301; text-align: center; margin-top: 0; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #A0AAB2; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border-radius: 5px; border: 1px solid #1E3A5F; background-color: #050B14; color: white; box-sizing: border-box; }
        button { background-color: #F5B301; color: #0A2540; border: none; padding: 15px; width: 100%; margin-top: 25px; font-weight: bold; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #FFC107; }
        .result-box { display: none; margin-top: 30px; background-color: #050B14; padding: 20px; border-radius: 5px; border: 1px dashed #F5B301; }
        .result-box h3 { color: #F5B301; margin-top: 0; font-size: 16px; }
        .code-area { width: 100%; height: 200px; font-family: monospace; font-size: 12px; background-color: #000; color: #00FF00; padding: 10px; border: 1px solid #1E3A5F; }
        .btn-copy { background-color: #1E3A5F; color: white; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="admin-container" id="login-section">
        <h2>Connexion Administration</h2>
        <label>Mot de passe :</label>
        <input type="password" id="password" placeholder="Entrez le mot de passe">
        <button onclick="login()">Se connecter</button>
    </div>

    <div class="admin-container" id="form-section" style="display: none;">
        <h2>Gérer le site SK PLUS</h2>
        
        <label>Texte du bandeau FLASH INFO :</label>
        <input type="text" id="breakingNews" placeholder="Ex: Flash info de dernière minute...">

        <label>Catégorie de l'article à la une :</label>
        <input type="text" id="heroCategory" placeholder="Ex: POLITIQUE, SPORT, CULTURE...">

        <label>Titre de l'article à la une :</label>
        <input type="text" id="heroTitle" placeholder="Ex: Lancement officiel de SK PLUS">

        <label>Description (sous-titre) :</label>
        <textarea id="heroDesc" rows="3"></textarea>

        <label>Lien de l'image (URL) :</label>
        <input type="text" id="heroImage" placeholder="https://...">

        <button onclick="genererCode()">Générer la mise à jour</button>

        <div class="result-box" id="result">
            <h3>✅ Copiez le code ci-dessous :</h3>
            <p style="font-size: 12px; color: #A0AAB2;">Allez sur GitHub > Ouvrez <b>data.js</b> > Cliquez sur le crayon ✏️ > Remplacez tout par ce code > Validez.</p>
            <textarea class="code-area" id="outputCode" readonly></textarea>
            <button class="btn-copy" onclick="copier()">Copier le code</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        function login() {
            const pass = document.getElementById('password').value;
            if (pass === "skplus2024") { // Le mot de passe
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('form-section').style.display = 'block';
                
                // Remplir le formulaire avec les données actuelles
                document.getElementById('breakingNews').value = siteData.breakingNews;
                document.getElementById('heroCategory').value = siteData.heroCategory;
                document.getElementById('heroTitle').value = siteData.heroTitle;
                document.getElementById('heroDesc').value = siteData.heroDesc;
                document.getElementById('heroImage').value = siteData.heroImage;
            } else {
                alert("Mot de passe incorrect !");
            }
        }

        function genererCode() {
            const bn = document.getElementById('breakingNews').value;
            const hc = document.getElementById('heroCategory').value;
            const ht = document.getElementById('heroTitle').value;
            const hd = document.getElementById('heroDesc').value;
            const hi = document.getElementById('heroImage').value;

            const code = `const siteData = {
    breakingNews: "${bn}",
    heroCategory: "${hc}",
    heroTitle: "${ht}",
    heroDesc: "${hd}",
    heroImage: "${hi}"
};`;

            document.getElementById('outputCode').value = code;
            document.getElementById('result').style.display = 'block';
        }

        function copier() {
            const copyText = document.getElementById('outputCode');
            copyText.select();
            document.execCommand("copy");
            alert("Code copié ! Allez le coller dans data.js sur GitHub.");
        }
    </script>
</body>
</html>
