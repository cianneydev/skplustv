<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK PLUS - Sendwe Katolo</title>
    <style>
        /* --- CHARTE GRAPHIQUE SK PLUS (Identique à avant) --- */
        :root { --bleu-fonce: #050B14; --bleu-profond: #0A2540; --jaune-or: #F5B301; --blanc: #FFFFFF; --gris: #8892B0; --bordure: #1E3A5F; --fond-image: #153B6B; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: var(--bleu-fonce); color: var(--blanc); line-height: 1.6; }
        
        header { border-bottom: 1px solid var(--bordure); position: sticky; top: 0; background-color: var(--bleu-fonce); z-index: 100; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; padding: 15px 4%; max-width: 1200px; margin: 0 auto; }
        .nav-logo { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .nav-logo span { color: var(--jaune-or); }
        .nav-links { display: none; }
        .nav-links a { color: var(--gris); text-decoration: none; margin-left: 20px; font-size: 14px; font-weight: 500; }
        .nav-links a:hover { color: var(--blanc); }
        .nav-live { color: #FF3B30; font-weight: bold; font-size: 12px; display: flex; align-items: center; gap: 5px; }
        .nav-live::before { content: ''; width: 8px; height: 8px; background-color: #FF3B30; border-radius: 50%; display: inline-block; animation: clignote 1s infinite; }

        .breaking-container { background-color: var(--jaune-or); color: var(--bleu-fonce); display: flex; align-items: center; overflow: hidden; position: relative; border-bottom: 2px solid var(--bleu-fonce); }
        .breaking-label { background-color: var(--bleu-fonce); color: var(--blanc); padding: 10px 15px; font-size: 11px; font-weight: 900; letter-spacing: 1px; z-index: 10; white-space: nowrap; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        .breaking-marquee { display: flex; white-space: nowrap; animation: defilement 20s linear infinite; }
        .breaking-marquee:hover { animation-play-state: paused; }
        .breaking-item { font-size: 13px; font-weight: bold; padding: 0 30px; display: flex; align-items: center; }
        .breaking-item::after { content: '•'; margin-left: 30px; color: var(--bleu-fonce); }

        @keyframes defilement { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes clignote { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .img-container { position: relative; overflow: hidden; background-color: var(--fond-image); }
        .img-container::before { content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent); animation: loading 1.5s infinite; z-index: 1; }
        @keyframes loading { 100% { left: 100%; } }
        .img-container img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 2; }

        .main-container { max-width: 1000px; margin: 30px auto; padding: 0 4%; }
        .hero-article { position: relative; border-radius: 10px; overflow: hidden; margin-bottom: 40px; border: 1px solid var(--bordure); cursor: pointer; }
        .hero-img-container { height: 300px; width: 100%; }
        .hero-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 20px; background: linear-gradient(to top, rgba(5,11,20,1) 0%, rgba(5,11,20,0.7) 60%, transparent 100%); z-index: 3; }
        .category-tag { background-color: #FF3B30; color: white; font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 3px; text-transform: uppercase; margin-right: 10px; }
        .category-tag.gold { background-color: var(--jaune-or); color: var(--bleu-fonce); }
        .hero-title { font-size: 24px; font-weight: 800; margin: 15px 0 10px; line-height: 1.2; }
        .hero-desc { font-size: 14px; color: #D1D5DB; margin-bottom: 15px; display: none; }
        .hero-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--gris); }
        .author-avatar { width: 24px; height: 24px; border-radius: 50%; background-color: var(--jaune-or); }

        .section-header { font-size: 14px; font-weight: bold; color: var(--gris); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-header::after { content: ''; flex: 1; height: 1px; background-color: var(--bordure); }

        .article-list { display: flex; flex-direction: column; gap: 25px; }
        .article-item { display: flex; justify-content: space-between; gap: 15px; padding-bottom: 25px; border-bottom: 1px solid var(--bordure); cursor: pointer; }
        .article-info { flex: 1; }
        .article-cat { font-size: 11px; font-weight: bold; color: var(--jaune-or); text-transform: uppercase; display: block; margin-bottom: 5px; }
        .article-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; transition: color 0.2s; }
        .article-item:hover .article-title { color: var(--jaune-or); }
        .article-meta { font-size: 12px; color: var(--gris); }
        .article-thumb-container { width: 100px; height: 70px; border-radius: 6px; flex-shrink: 0; }

        @media (min-width: 768px) {
            .nav-links { display: flex; align-items: center; }
            .hero-img-container { height: 450px; }
            .hero-content { padding: 40px; }
            .hero-title { font-size: 36px; }
            .hero-desc { display: block; }
            .article-title { font-size: 18px; }
            .article-thumb-container { width: 140px; height: 90px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="nav-logo">SK <span>PLUS</span></div>
            <div class="nav-links">
                <a href="#" style="color: var(--blanc);">Accueil</a>
                <a href="#">Actualités</a>
                <a href="#">Vidéos</a>
                <a href="#">Émissions</a>
                <a href="#" class="nav-live">LIVE</a>
            </div>
        </div>
    </header>

    <div class="breaking-container">
        <div class="breaking-label">FLASH INFO</div>
        <div class="breaking-marquee">
            <div class="breaking-item" id="bn-1"></div>
            <div class="breaking-item" id="bn-2"></div>
        </div>
    </div>

    <main class="main-container">
        <article class="hero-article">
            <div class="img-container hero-img-container">
                <img id="hero-img" src="" alt="A la une" onload="this.style.opacity=1" style="opacity: 0; transition: opacity 0.5s;">
            </div>
            <div class="hero-content">
                <div>
                    <span class="category-tag" id="hero-cat"></span>
                    <span class="category-tag gold">À LA UNE</span>
                </div>
                <h1 class="hero-title" id="hero-title"></h1>
                <p class="hero-desc" id="hero-desc"></p>
                <div class="hero-meta">
                    <div class="author-avatar"></div>
                    <span>Rédaction SK PLUS • Aujourd'hui</span>
                </div>
            </div>
        </article>

        <div class="section-header">Top Stories</div>
        <div class="article-list" id="article-list">
            <!-- Les articles seront injectés ici par le script -->
        </div>
    </main>

    <!-- SCRIPT DE MISE A JOUR AUTOMATIQUE -->
    <script src="data.js"></script>
    <script>
        // 1. Bandeau
        document.getElementById('bn-1').innerText = siteData.breakingNews;
        document.getElementById('bn-2').innerText = siteData.breakingNews;

        // 2. A la une
        document.getElementById('hero-img').src = siteData.heroImage;
        document.getElementById('hero-cat').innerText = siteData.heroCategory;
        document.getElementById('hero-title').innerText = siteData.heroTitle;
        document.getElementById('hero-desc').innerText = siteData.heroDesc;

        // 3. Top Stories
        const listContainer = document.getElementById('article-list');
        siteData.articles.forEach(article => {
            const articleHTML = `
                <div class="article-item">
                    <div class="article-info">
                        <span class="article-cat">${article.category}</span>
                        <h2 class="article-title">${article.title}</h2>
                        <div class="article-meta">${article.time}</div>
                    </div>
                    <div class="img-container article-thumb-container">
                        <img src="${article.image}" alt="${article.title}" onload="this.style.opacity=1" style="opacity: 0; transition: opacity 0.5s;">
                    </div>
                </div>
            `;
            listContainer.innerHTML += articleHTML;
        });
    </script>
</body>
</html>
